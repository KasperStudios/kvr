[package]
name = "kvr-desktopd"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "KVR desktop daemon: runs PC apps in a hidden Wayland compositor and streams them into Minecraft"
publish = false

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# D1 = Linux only (headless Smithay compositor). Windows backend (hidden desktop) is D5.
[target.'cfg(target_os = "linux")'.dependencies]
smithay = { version = "0.6", default-features = false, features = ["wayland_frontend"] }
memmap2 = "0.9"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
